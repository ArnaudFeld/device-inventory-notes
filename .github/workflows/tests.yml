name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml voluptuous
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: |
          python - <<'PY'
          import ast, pathlib
          for path in sorted(pathlib.Path("custom_components/device_inventory_notes").glob("*.py")):
              ast.parse(path.read_text(encoding="utf-8"))
              print(f"ok {path}")
          PY
      - name: Manifest and translation files must be valid JSON
        run: |
          python - <<'PY'
          import json, pathlib
          base = pathlib.Path("custom_components/device_inventory_notes")
          files = [base / "manifest.json", *sorted((base / "translations").glob("*.json"))]
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"ok {path}")
          PY
